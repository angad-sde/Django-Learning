
<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
    {% if student %}
        <h1>Edit Student</h1>
    {% else %}
        <h1>Add Student</h1>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input
            type="text"
            name="name"
            value="{{ student.name|default:'' }}"
            required
        >
        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            value="{{ student.email|default:'' }}"
            required
        >
        <br><br>

        <label>Age:</label>
        <input
            type="number"
            name="age"
            value="{{ student.age|default:'' }}"
            required
        >
        <br><br>

        <button type="submit">Save</button>
    </form>

    <a href="{% url 'student_list' %}">Back</a>
</body>
</html>
